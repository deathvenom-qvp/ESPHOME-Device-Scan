# Switchboard -- 4-gang relay board
#
# Demonstrates the other MAC-suffix idiom: no ${mac} substitution anywhere,
# just ESPHome's own `name_add_mac_suffix`. The generator turns that off and
# writes the discovered name into `esphome.name`.
#
# x-match-prefix: switchboard, swb
# x-match-model:  Switchboard
# x-priority:     5

esphome:
  name: switchboard
  friendly_name: Switchboard
  name_add_mac_suffix: true

esp8266:
  board: esp01_1m

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Switchboard Fallback"
    password: !secret ap_password

captive_portal:

switch:
  - platform: gpio
    pin: GPIO12
    name: "Relay 1"
    id: relay_1
  - platform: gpio
    pin: GPIO13
    name: "Relay 2"
    id: relay_2
  - platform: gpio
    pin: GPIO14
    name: "Relay 3"
    id: relay_3
  - platform: gpio
    pin: GPIO15
    name: "Relay 4"
    id: relay_4

binary_sensor:
  - platform: status
    name: "Status"

sensor:
  - platform: uptime
    name: "Uptime"
