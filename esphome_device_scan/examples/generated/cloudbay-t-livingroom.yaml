# Generated by ESPHome Device Scan from a base template.
# Template: cloudbay-t.yaml
# Device:   cloudbay-t-livingroom
# MAC:      AA:BB:CC:DD:EE:FF
# Safe to edit: a scan never overwrites this file.

# CloudBay T -- base firmware, flashed to every cloudbay-t device.
#
# This file needs no directives and no changes to work as a parent. ESPHome
# Device Scan recognises it as a base config from the MAC-suffix logic in
# esphome.name below, and reads the family it claims from that same name --
# here, every cloudbay-t-* device.
#
# For each such device with no config of its own, the add-on writes a sibling
# file with the real node name and the MAC-suffix logic resolved. This file is
# never modified, and never counted as any device's own config.
#
# Directives are optional, and only needed to claim more than the name implies:
# x-match-prefix, x-match-regex, x-match-model, x-mac-policy, x-priority, and
# x-template (which forces parent status for a base carrying no MAC logic).

substitutions:
  devicename: cloudbay-t-livingroom
  mac: "ddeeff"
  friendly: "CloudBay T"

esphome:
  name: cloudbay-t-livingroom
  friendly_name: "CloudBay T Living Room"
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - logger.log: "CloudBay T booted"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback hotspot, used when the configured network is unreachable.
  ap:
    ssid: "${devicename}-${mac}"
    password: !secret ap_password

captive_portal:

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "Status"

button:
  - platform: restart
    name: "Restart"
