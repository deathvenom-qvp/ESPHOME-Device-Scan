---
name: ESPHome Device Scan
version: "1.4.1"
slug: esphome_device_scan
description: >-
  Scans Home Assistant for ESPHome devices that have no YAML config, matches
  each to a base template by naming pattern, and generates a per-device YAML
  with the real node name and the MAC-suffix logic resolved.
url: https://github.com/deathvenom-qvp/ESPHOME-Device-Scan
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: application
boot: auto

# Ingress-only panel. The add-on serves on 8099 and Supervisor proxies to it,
# so no host port is published.
ingress: true
ingress_port: 8099
panel_icon: mdi:chip
panel_title: ESPHome Scan
panel_admin: true

# homeassistant_api grants the Core REST/WebSocket proxy used for the device
# registry, entity registry and config entries. hassio_api is used only to read
# add-on info (e.g. locating the ESPHome add-on's config dir).
homeassistant_api: true
hassio_api: true
hassio_role: default

# homeassistant_config -> /homeassistant. ESPHome YAML lives in ./esphome,
# and that is also where parent templates are read from -- nothing is
# copied in, so the add-on needs no config directory of its own.
map:
  - homeassistant_config:rw

options:
  esphome_config_dir: /homeassistant/esphome
  scan_interval_minutes: 15
  auto_generate: true
  scan_on_startup: true
  mac_policy: suffix3
  name_add_mac_suffix_action: set_false
  dry_run: false
  log_level: info

schema:
  esphome_config_dir: str
  scan_interval_minutes: int(1,1440)
  auto_generate: bool
  scan_on_startup: bool
  mac_policy: list(suffix3|full|strip)
  name_add_mac_suffix_action: list(set_false|remove)
  dry_run: bool
  log_level: list(trace|debug|info|notice|warning|error|fatal)
